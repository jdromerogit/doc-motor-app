version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip3 install --upgrade pip
      - pip3 install --no-cache-dir -r requirements.txt
run:
  runtime-version: 3.11
  command: python3 app.py
  network:
    port: 8000
  env:
    - name: BUCKET_PLANTILLAS
      value: pe-plantillas-doc-motor
    - name: BUCKET_RESULTADOS
      value: pe-resultados-doc-motor
    - name: AWS_REGION
      value: us-east-1
