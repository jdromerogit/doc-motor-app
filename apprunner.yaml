version: 1.0
runtime: python3
build:
  commands:
    build:
      - python -m pip install --upgrade pip
      - python -m pip install --no-cache-dir -r requirements.txt
run:
  command: python app.py
  network:
    port: 8000
  env:
    - name: BUCKET_PLANTILLAS
      value: pe-plantillas-doc-motor
    - name: BUCKET_RESULTADOS
      value: pe-resultados-doc-motor
    - name: AWS_REGION
      value: us-east-1
